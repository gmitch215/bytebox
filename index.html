<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>bytebox</title>
		<style>
			:root {
				color-scheme: light dark;
				--fg: #16181d;
				--muted: #5b6270;
				--bg: #fbfbfc;
				--card: #ffffff;
				--line: #e3e5ea;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--fg: #e9ebf0;
					--muted: #98a0b0;
					--bg: #101216;
					--card: #171a20;
					--line: #262a33;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 4rem 1.5rem;
				background: var(--bg);
				color: var(--fg);
				font:
					16px/1.6 ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					sans-serif;
			}
			main {
				max-width: 44rem;
				margin: 0 auto;
			}
			h1 {
				margin: 0 0 0.25rem;
				font-size: 2.5rem;
				letter-spacing: -0.02em;
			}
			p.lead {
				margin: 0 0 2rem;
				color: var(--muted);
				font-size: 1.125rem;
			}
			.links {
				display: grid;
				gap: 1rem;
				grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
			}
			a.card {
				display: block;
				padding: 1.25rem 1.5rem;
				border: 1px solid var(--line);
				border-radius: 0.75rem;
				background: var(--card);
				color: inherit;
				text-decoration: none;
			}
			a.card:hover {
				border-color: var(--muted);
			}
			a.card strong {
				display: block;
				font-size: 1.05rem;
			}
			a.card span {
				color: var(--muted);
				font-size: 0.9rem;
			}
			footer {
				margin-top: 2.5rem;
				color: var(--muted);
				font-size: 0.9rem;
			}
			footer a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>bytebox</h1>
			<p class="lead">Java on Cloudflare Workers.</p>
			<div class="links">
				<a
					class="card"
					href="javadoc/"
				>
					<strong>Java API</strong>
					<span>Worker entry points, bindings, and the Gradle plugin</span>
				</a>
				<a
					class="card"
					href="typedoc/"
				>
					<strong>TypeScript API</strong>
					<span>The loader that runs a compiled module on Workers</span>
				</a>
			</div>
			<footer>
				<a href="https://github.com/gmitch215/bytebox">github.com/gmitch215/bytebox</a>
			</footer>
		</main>
	</body>
</html>
