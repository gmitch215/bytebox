coverage:
  precision: 2
  round: down
  range: '10...90'
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: 50%
        threshold: 5%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: core
      paths:
        - core/src/main/
    - name: plugin
      paths:
        - plugin/src/main/
    - name: npm
      paths:
        - npm/src/

ignore:
  - '**/build/**'
  - '**/src/test/**'
  - 'npm/tests/**'
  - 'samples/**'
  - 'size/**'
