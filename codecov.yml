coverage:
  precision: 2
  round: down
  range: '10...90'
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: 50%
        threshold: 5%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer, component_list'
  require_changes: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 2%
  individual_components:
    - component_id: core
      name: core
      paths:
        - core/src/main/**
    - component_id: plugin
      name: plugin
      paths:
        - plugin/src/main/**
    - component_id: npm
      name: npm
      paths:
        - npm/src/**
    - component_id: size
      name: size
      paths:
        - size/src/main/**

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: core
      paths:
        - core/src/main/
    - name: plugin
      paths:
        - plugin/src/main/
    - name: npm
      paths:
        - npm/src/
    - name: size
      paths:
        - size/src/main/

ignore:
  - '**/build/**'
  - '**/src/test/**'
  - 'npm/tests/**'
  - 'samples/**'
