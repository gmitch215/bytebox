name: Publish Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    name: Deploy Documentation
    env:
      # bun install runs prepare, which installs the git hooks; the deploy scripts then commit and
      # lint-staged rewrites generated documentation
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Change Permissions
        run: chmod +x ./gradlew
      - name: Build Javadoc
        run: ./gradlew allJavadoc
      - name: Build TypeDoc
        run: |
          bun install --frozen-lockfile
          bun run docs:build
      - name: Deploy Javadoc
        run: bash javadoc.sh "${GITHUB_SHA::7}"
      - name: Deploy TypeDoc
        run: bash typedoc.sh "${GITHUB_SHA::7}"
