name: Run End-to-End Tests

on:
  push:
    branches: [master, ver/*, feat/*]
  pull_request:
    branches: [master, ver/*, feat/*]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    name: Build Every Sample
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Change Permissions
        run: chmod +x ./gradlew
      - name: Build Every Sample
        working-directory: samples
        run: ../gradlew buildWorkers
      - name: Report Every Module Size
        working-directory: samples
        run: ../gradlew sizeReport
      - name: Archive The Generated Workers
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: generated-workers
          path: samples/*/build/bytebox/worker/

  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    name: Drive Java On workerd
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run Both Lanes
        run: bun run test
      - name: Refuse A Silent Skip
        run: |
          # a lane that ran nothing reads as a pass, which is the failure this catches
          bun run --cwd npm test -- --reporter=json --outputFile=/tmp/lanes.json
          node -e '
            const report = require("/tmp/lanes.json");
            const total = report.numTotalTests ?? 0;
            const skipped = report.numPendingTests ?? 0;
            if (total === 0) throw new Error("no tests ran");
            if (skipped > 0) throw new Error(skipped + " test(s) were skipped");
            console.log(total + " tests ran, none skipped");
          '
