name: Release Project

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        description: 'Changelog to replace the auto-generated one'
      suffix:
        type: string
        description: 'Suffix to append to the version'
        default: ''
      skip_maven_central:
        type: boolean
        description: 'Skip Maven Central'
        default: false
      skip_plugin_portal:
        type: boolean
        description: 'Skip the Gradle Plugin Portal'
        default: false
      skip_npm:
        type: boolean
        description: 'Skip npmjs'
        default: false
      skip_github_packages:
        type: boolean
        description: 'Skip GitHub Packages'
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    name: Verify
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Change Permissions
        run: chmod +x ./gradlew
      - name: Check Gradle Projects
        run: ./gradlew check validatePlugins
      - name: Check NPM Package
        working-directory: npm
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: verify

    permissions:
      contents: read
      packages: write

    name: Publish Java Artifacts
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Change Permissions
        run: chmod +x ./gradlew
      - name: Publish to Maven Central
        if: ${{ !inputs.skip_maven_central }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral
      - name: Publish to GitHub Packages
        if: ${{ !inputs.skip_github_packages }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
      - name: Publish to the Gradle Plugin Portal
        if: ${{ !inputs.skip_plugin_portal }}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :bytebox-plugin:publishPlugins
      - name: Stop Gradle
        run: ./gradlew --stop

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    permissions:
      contents: read
      packages: write
      id-token: write

    name: Publish NPM Package
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade NPM
        run: npm install -g npm@latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Publish to NPM
        if: ${{ !inputs.skip_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Set up Node for GitHub Packages
        if: ${{ !inputs.skip_github_packages }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gmitch215'
      - name: Publish to GitHub Packages
        if: ${{ !inputs.skip_github_packages }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Packages only accepts scoped names, so the scope is added for this publish only
          npm pkg set name="@gmitch215/bytebox"
          npm publish --access public
          npm pkg set name="bytebox"

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [maven, npm]

    permissions:
      contents: write

    name: Create Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Change Permissions
        run: chmod +x ./gradlew
      - name: Extract Gradle version
        run: echo "VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}')" >> $GITHUB_ENV
      - name: Retrieve Latest Tag
        run: echo "LATEST_TAG=$(git describe --tags --abbrev=0 || echo '')" >> $GITHUB_ENV
      - name: Generate Changelog
        if: ${{ github.event.inputs.changelog == '' }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ env.LATEST_TAG }}'
          toTag: '${{ github.ref_name }}'
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          name: bytebox v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          body: ${{ steps.changelog.outputs.changelog || github.event.inputs.changelog }}
          draft: false
          prerelease: ${{ github.ref_name != 'master' }}
