name: Check Test Coverage

on:
  push:
    branches: [master, ver/*, feat/*]
  pull_request:
    branches: [master, ver/*, feat/*]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    name: Java Coverage
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Change Permissions
        run: chmod +x ./gradlew
      - name: Run Suite with Coverage
        run: ./gradlew check jacocoTestReport
      - name: Upload Core Coverage
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gmitch215/bytebox
          fail_ci_if_error: false
          flags: core
          files: core/build/jacoco.xml
      - name: Upload Plugin Coverage
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gmitch215/bytebox
          fail_ci_if_error: false
          flags: plugin
          files: plugin/build/jacoco.xml
      - name: Upload Size Coverage
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gmitch215/bytebox
          fail_ci_if_error: false
          flags: size
          files: size/build/jacoco.xml

  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    name: Java Coverage From workerd
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Change Permissions
        run: chmod +x ./gradlew
      - name: Start The Servers
        run: docker compose -f docker/compose.yml up -d
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build The Instrumented Module
        run: ./gradlew :bytebox-coverage-fixture:generateWasmGC
      - name: Record What workerd Executes
        run: bun run --cwd npm test:java
      - name: Build The Report
        run: ./gradlew :bytebox-coverage:workersCoverageReport
      - name: Upload Coverage
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gmitch215/bytebox
          fail_ci_if_error: false
          flags: core
          files: core/build/jacoco-workers.xml
      - name: Stop The Servers
        if: always()
        run: docker compose -f docker/compose.yml down -v

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    name: NPM Coverage
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run Suite with Coverage
        run: bun run test:coverage
      - name: Upload Coverage
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gmitch215/bytebox
          fail_ci_if_error: false
          flags: npm
          files: npm/coverage/clover.xml
