name: bytebox

services:
  greenmail:
    image: greenmail/standalone:2.1.12@sha256:9f32971b4f25d32b4de6fa2e297423768441c65e4541f6aecd7631c890a229a7
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.smtp -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=tester:testpass@localhost'
    ports:
      - '127.0.0.1:3025:3025'

  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: bytebox
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fixture -d bytebox']
      interval: 2s
      timeout: 3s
      retries: 30

  certs:
    image: alpine/openssl@sha256:42c7389ef077aed0eb4e96d0abbd094083d701bbaff1313073b061c0c9cd8278
    volumes:
      - ./certs:/certs
    command:
      - req
      - -x509
      - -newkey
      - rsa:2048
      - -nodes
      - -days
      - '3650'
      - -subj
      - /CN=localhost
      - -addext
      - subjectAltName=DNS:localhost,IP:127.0.0.1
      - -keyout
      - /certs/server.key
      - -out
      - /certs/server.crt

  tls:
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./tls.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8443:8443'
